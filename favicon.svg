<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Git branch icon with benchmark checkmark -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>

  <!-- Git branch -->
  <g fill="white" stroke="white" stroke-width="3" stroke-linecap="round">
    <circle cx="30" cy="35" r="6" fill="white"/>
    <circle cx="70" cy="35" r="6" fill="white"/>
    <circle cx="50" cy="65" r="6" fill="white"/>
    <line x1="30" y1="41" x2="30" y2="55" stroke-width="3"/>
    <line x1="70" y1="41" x2="70" y2="55" stroke-width="3"/>
    <line x1="30" y1="55" x2="50" y2="59" stroke-width="3"/>
    <line x1="70" y1="55" x2="50" y2="59" stroke-width="3"/>
  </g>

  <!-- Checkmark overlay -->
  <path d="M 62 28 L 67 33 L 77 20" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
